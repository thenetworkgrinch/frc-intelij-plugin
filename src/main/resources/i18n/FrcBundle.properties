# The ...helpContext.text must have some tag inside the <html>, otherwise the text is not wrapped in the context help popup. Some sort of bug. If none are directly needed, wrap a period: blah blah blah<em>.</em>
frc.ui.wizard.projectSettingsStep.kotlinDsl.disclaimer.text=<html>Using Kotlin DSL for Gradle builds is not officially supported by FRC/WPILib. As such, by using the Kotlin DSL, you acknowledge that you will not receive any support from the WPI Lib team, and support from the community will likely be very limited. There are known issues with using Kotlin DSL Gradle files in VS Code. As such, if you have team members using VS Code, use of the Kotlin DSL is not recommended. <em>The use of Kotlin DSL is only recommend for developers experienced with the Gradle Kotlin DSL.</em><br><small>(This disclaimer is included at the request of the WPI Lib development team.)</small></html>


