frc.errorReportSubmitter.privacy.policy=I agree to forward information to the developers of the FRC plugin about my hardware configuration, software \
  configuration, product information, and the error details shown above. I consent that the data will be stored and processed at Sentry, and is \
  governed by their <a href="https://sentry.io/privacy/">privacy policy</a> and <a href="https://sentry.io/legal/dpa/">Data Processing Addendum (DPA)</a>. \
  I allow the plugin developers to use the information to improve the plugin. Unless you enter personal information in the message or choose to \
  add attachments containing personal identifiable information (PII) you (the user) will stay anonymous to the plugin developers as <b>no personal \
  identifiable information (PII) is sent in this report.</b> The service at Sentry will try to scrub PII automatically if you include any. To get a \
  response from the plugin developers please <a href="https://gitlab.com/Javaru/frc-intellij-idea-plugin/-/issues">open an issue on GitLab</a>. \
  Thank you for helping to improve the FRC plugin by submitting this error report.


