frc.templates.options.singletonSubsystems.doubleCheckedLockOption.contextHelp.primaryLine=Example of Double-Checked Locking Initialization
frc.templates.options.singletonSubsystems.doubleCheckedLockOption.contextHelp.secondaryLine=Thread safe. Lazy init. Best for intermittently used heavy-weight classes. Or when late/lazy initialization is needed.
