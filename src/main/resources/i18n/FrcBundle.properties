frc.templates.options.singletonSubsystems.eagerOption.contextHelp.secondaryLine=Thread safe. Simple design. Good for light-weight classes. Good option for most Robots.
frc.templates.options.singletonSubsystems.lazyOption.text=Lazy initialization
frc.templates.options.singletonSubsystems.lazyOption.contextHelp.primaryLine=Example of Lazy Initialization
frc.templates.options.singletonSubsystems.lazyOption.contextHelp.secondaryLine=Classic, but not thread safe.
