frc.templates.options.singletonSubsystems.contextHelp.text=<html>Subsystems should only ever have a single instance. Making the Subsystem class a Singleton guarantees this. \
  While the WPI Lib out-of-the-box templates do not define subsystems as singletons, their use is recommended.<br><br> \
  Use the "Learn more" link below to learn about the initialization methodology options.<br><br>  \
  This option is automatically disabled if the name contains "Abstract" as it is assumed you are creating an abstract class.</html>
frc.templates.options.singletonSubsystems.includeJavadoc.checkbox.text=Include Javadoc with Singleton methods
frc.templates.options.singletonSubsystems.includeJavadoc.contextHelp.text=If selected, explanatory javadoc is included with the singleton methods and fields. Recommended for newer developers/students to aid in learning.
